<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="system-ui,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4255cf"/>
    </marker>
  </defs>
  <rect width="960" height="640" fill="#f8fafc"/>
  <rect x="8" y="8" width="944" height="624" rx="16" fill="#ffffff" stroke="#dce3ee"/>

  <text x="48" y="52" font-size="15" font-weight="650" fill="#18233b">包含关系:AI 是一门学科,一路收窄到具体的模型</text>
  <rect x="48" y="76" width="420" height="240" rx="14" fill="#e9edff" stroke="#4255cf"/>
  <text x="64" y="104" font-size="14" font-weight="650" fill="#3344ad">AI 人工智能 · 1956 年定名</text>
  <rect x="72" y="120" width="372" height="182" rx="12" fill="#dfe7ff" stroke="#5b6ede"/>
  <text x="88" y="146" font-size="13.5" fill="#3344ad">机器学习 · 从数据中学规律</text>
  <rect x="96" y="160" width="324" height="128" rx="10" fill="#d3ddff" stroke="#7283ea"/>
  <text x="112" y="184" font-size="13.5" fill="#3344ad">深度学习 · 多层神经网络</text>
  <rect x="120" y="200" width="276" height="74" rx="8" fill="#ffffff" stroke="#4255cf"/>
  <text x="258" y="230" font-size="13.5" font-weight="650" fill="#18233b" text-anchor="middle">大语言模型(LLM)</text>
  <text x="258" y="252" font-size="12" fill="#52627a" text-anchor="middle">Transformer · 2017 至今</text>

  <rect x="48" y="348" width="420" height="132" rx="12" fill="#ffffff" stroke="#dce3ee"/>
  <text x="64" y="378" font-size="13" fill="#18233b">同一个模型,加上不同的东西:</text>
  <text x="64" y="404" font-size="13" fill="#52627a">+ 对话界面 → 聊天助手(ChatGPT)</text>
  <text x="64" y="430" font-size="13" fill="#52627a">+ 工具和循环 → Agent</text>
  <text x="64" y="456" font-size="13" fill="#52627a">+ 工程框架 → 能交付的生产力</text>

  <text x="520" y="52" font-size="15" font-weight="650" fill="#18233b">组合关系:Agent 外面还要再包一层 Harness</text>
  <rect x="520" y="76" width="392" height="300" rx="14" fill="#f3f6fb" stroke="#4255cf" stroke-dasharray="7 5"/>
  <text x="536" y="104" font-size="13.5" font-weight="650" fill="#3344ad">Harness:提示词 · 权限 · 上下文 · 记录</text>
  <rect x="544" y="120" width="344" height="228" rx="12" fill="#ffffff" stroke="#4255cf"/>
  <text x="716" y="148" font-size="14" font-weight="650" fill="#18233b" text-anchor="middle">Agent</text>
  <text x="716" y="168" font-size="11.5" fill="#52627a" text-anchor="middle">模型 + 工具 + 循环</text>
  <rect x="568" y="180" width="296" height="44" rx="8" fill="#e9edff" stroke="#8f9ce8"/>
  <text x="716" y="207" font-size="13" fill="#3344ad" text-anchor="middle">模型(负责思考)</text>
  <rect x="568" y="232" width="296" height="44" rx="8" fill="#dfe7ff" stroke="#8f9ce8"/>
  <text x="716" y="259" font-size="13" fill="#3344ad" text-anchor="middle">工具(负责行动)</text>
  <rect x="568" y="284" width="296" height="44" rx="8" fill="#d3ddff" stroke="#8f9ce8"/>
  <text x="716" y="311" font-size="13" fill="#3344ad" text-anchor="middle">循环(直到完成)</text>

  <line x1="666" y1="378" x2="666" y2="390" stroke="#4255cf" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="766" y1="390" x2="766" y2="378" stroke="#4255cf" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="544" y="394" width="344" height="52" rx="12" fill="#ffffff" stroke="#dce3ee"/>
  <text x="716" y="425" font-size="13" fill="#52627a" text-anchor="middle">环境:文件系统 · 终端 · 浏览器 · API</text>

  <rect x="48" y="540" width="864" height="56" rx="12" fill="#e9edff"/>
  <text x="480" y="574" font-size="14" font-weight="650" fill="#3344ad" text-anchor="middle">AI 是领域 · 模型是引擎 · Agent 是会干活的员工 · Harness 是接上现实的马具</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="system-ui,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4255cf"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#f8fafc"/>
  <rect x="8" y="8" width="944" height="544" rx="16" fill="#ffffff" stroke="#dce3ee"/>

  <rect x="80" y="150" width="170" height="64" rx="12" fill="#e9edff" stroke="#4255cf"/>
  <text x="165" y="177" font-size="14" font-weight="650" fill="#3344ad" text-anchor="middle">目标</text>
  <text x="165" y="199" font-size="12" fill="#52627a" text-anchor="middle">要做完一件事</text>

  <rect x="400" y="120" width="240" height="84" rx="12" fill="#ffffff" stroke="#4255cf" stroke-width="2"/>
  <text x="520" y="154" font-size="14" font-weight="650" fill="#18233b" text-anchor="middle">模型 · 思考</text>
  <text x="520" y="180" font-size="12" fill="#52627a" text-anchor="middle">结合目标、历史与工具结果</text>

  <rect x="730" y="120" width="180" height="84" rx="12" fill="#dfe7ff" stroke="#8f9ce8"/>
  <text x="820" y="154" font-size="14" font-weight="650" fill="#18233b" text-anchor="middle">行动 · 调用工具</text>
  <text x="820" y="180" font-size="12" fill="#52627a" text-anchor="middle">读文件 · 跑命令 · 搜索</text>

  <rect x="730" y="330" width="180" height="84" rx="12" fill="#d3ddff" stroke="#8f9ce8"/>
  <text x="820" y="364" font-size="14" font-weight="650" fill="#18233b" text-anchor="middle">环境 · 真实世界</text>
  <text x="820" y="390" font-size="12" fill="#52627a" text-anchor="middle">返回执行结果</text>

  <rect x="400" y="330" width="240" height="84" rx="12" fill="#dfe7ff" stroke="#8f9ce8"/>
  <text x="520" y="364" font-size="14" font-weight="650" fill="#18233b" text-anchor="middle">观察 · 写回上下文</text>
  <text x="520" y="390" font-size="12" fill="#52627a" text-anchor="middle">模型看到工具的结果</text>

  <rect x="80" y="330" width="170" height="84" rx="12" fill="#e9edff" stroke="#4255cf"/>
  <text x="165" y="364" font-size="14" font-weight="650" fill="#3344ad" text-anchor="middle">完成 · 交付</text>
  <text x="165" y="390" font-size="12" fill="#52627a" text-anchor="middle">目标达成,循环结束</text>

  <path d="M250,182 H300 V162 H392" fill="none" stroke="#4255cf" stroke-width="2" marker-end="url(#arr4)"/>
  <line x1="648" y1="162" x2="722" y2="162" stroke="#4255cf" stroke-width="2" marker-end="url(#arr4)"/>
  <line x1="820" y1="212" x2="820" y2="322" stroke="#4255cf" stroke-width="2" marker-end="url(#arr4)"/>
  <line x1="722" y1="372" x2="648" y2="372" stroke="#4255cf" stroke-width="2" marker-end="url(#arr4)"/>
  <line x1="520" y1="322" x2="520" y2="212" stroke="#4255cf" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr4)"/>
  <text x="536" y="270" font-size="12" fill="#52627a">未完成,继续循环</text>
  <line x1="392" y1="372" x2="258" y2="372" stroke="#4255cf" stroke-width="2" marker-end="url(#arr4)"/>
  <text x="325" y="360" font-size="11.5" fill="#52627a" text-anchor="middle">判断已完成</text>

  <rect x="80" y="470" width="800" height="48" rx="12" fill="#e9edff"/>
  <text x="480" y="500" font-size="13.5" font-weight="650" fill="#3344ad" text-anchor="middle">模型负责想,工具负责做,循环负责把它们连起来 —— 这就是 Agent 的心跳</text>
</svg>

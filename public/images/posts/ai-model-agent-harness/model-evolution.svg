<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" font-family="system-ui,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4255cf"/>
    </marker>
  </defs>
  <rect width="960" height="280" fill="#f8fafc"/>
  <rect x="8" y="8" width="944" height="264" rx="16" fill="#ffffff" stroke="#dce3ee"/>

  <rect x="48" y="70" width="190" height="120" rx="12" fill="#e9edff" stroke="#8f9ce8"/>
  <text x="143" y="100" font-size="14" font-weight="650" fill="#18233b" text-anchor="middle">写规则 · 专家系统</text>
  <text x="143" y="120" font-size="11.5" fill="#52627a" text-anchor="middle">1950s – 1980s</text>
  <text x="143" y="145" font-size="12" fill="#52627a" text-anchor="middle">人把知识一条条教给机器</text>
  <text x="143" y="167" font-size="12" fill="#52627a" text-anchor="middle">规则之外就无能为力</text>

  <line x1="244" y1="130" x2="260" y2="130" stroke="#4255cf" stroke-width="2" marker-end="url(#arr3)"/>

  <rect x="268" y="70" width="190" height="120" rx="12" fill="#dfe7ff" stroke="#8f9ce8"/>
  <text x="363" y="100" font-size="14" font-weight="650" fill="#18233b" text-anchor="middle">机器学习</text>
  <text x="363" y="120" font-size="11.5" fill="#52627a" text-anchor="middle">1990s – 2010s</text>
  <text x="363" y="145" font-size="12" fill="#52627a" text-anchor="middle">从数据里自动学规律</text>
  <text x="363" y="167" font-size="12" fill="#52627a" text-anchor="middle">特征仍靠人工设计</text>

  <line x1="464" y1="130" x2="480" y2="130" stroke="#4255cf" stroke-width="2" marker-end="url(#arr3)"/>

  <rect x="488" y="70" width="190" height="120" rx="12" fill="#d3ddff" stroke="#8f9ce8"/>
  <text x="583" y="100" font-size="14" font-weight="650" fill="#18233b" text-anchor="middle">深度学习</text>
  <text x="583" y="120" font-size="11.5" fill="#52627a" text-anchor="middle">2012 –</text>
  <text x="583" y="145" font-size="12" fill="#52627a" text-anchor="middle">多层网络自己学特征</text>
  <text x="583" y="167" font-size="12" fill="#52627a" text-anchor="middle">数据与算力成为关键</text>

  <line x1="684" y1="130" x2="700" y2="130" stroke="#4255cf" stroke-width="2" marker-end="url(#arr3)"/>

  <rect x="708" y="70" width="190" height="120" rx="12" fill="#ffffff" stroke="#4255cf" stroke-width="2"/>
  <text x="803" y="100" font-size="14" font-weight="650" fill="#18233b" text-anchor="middle">大语言模型</text>
  <text x="803" y="120" font-size="11.5" fill="#3344ad" text-anchor="middle">2017 –</text>
  <text x="803" y="145" font-size="12" fill="#52627a" text-anchor="middle">Transformer + 超大规模</text>
  <text x="803" y="167" font-size="12" fill="#52627a" text-anchor="middle">涌现出通用对话与推理</text>

  <rect x="48" y="220" width="864" height="44" rx="12" fill="#e9edff"/>
  <text x="480" y="248" font-size="13.5" font-weight="650" fill="#3344ad" text-anchor="middle">路线转变:从"把知识教给机器"到"让机器从数据里自己学",上限从人转向了数据和规模</text>
</svg>

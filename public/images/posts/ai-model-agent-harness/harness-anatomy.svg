<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" font-family="system-ui,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="arr5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4255cf"/>
    </marker>
  </defs>
  <rect width="960" height="650" fill="#f8fafc"/>
  <rect x="8" y="8" width="944" height="634" rx="16" fill="#ffffff" stroke="#dce3ee"/>

  <rect x="40" y="36" width="880" height="484" rx="16" fill="#f8fafc" stroke="#4255cf" stroke-dasharray="8 6"/>
  <text x="60" y="66" font-size="15" font-weight="650" fill="#3344ad">Harness:包在模型外面、让它真正能干活的整套工程</text>

  <rect x="64" y="84" width="832" height="48" rx="10" fill="#e9edff" stroke="#8f9ce8"/>
  <text x="480" y="103" font-size="13.5" font-weight="650" fill="#3344ad" text-anchor="middle">系统提示词</text>
  <text x="480" y="122" font-size="11.5" fill="#52627a" text-anchor="middle">角色 · 规范 · 安全边界</text>

  <rect x="64" y="152" width="280" height="70" rx="10" fill="#ffffff" stroke="#dce3ee"/>
  <text x="204" y="180" font-size="13.5" font-weight="650" fill="#18233b" text-anchor="middle">上下文工程</text>
  <text x="204" y="202" font-size="11.5" fill="#52627a" text-anchor="middle">历史裁剪 · 摘要压缩 · 记忆文件</text>

  <rect x="360" y="152" width="240" height="70" rx="10" fill="#e9edff" stroke="#4255cf" stroke-width="2"/>
  <text x="480" y="180" font-size="13.5" font-weight="650" fill="#3344ad" text-anchor="middle">模型(引擎)</text>
  <text x="480" y="202" font-size="11.5" fill="#52627a" text-anchor="middle">负责思考与决策</text>

  <rect x="616" y="152" width="280" height="70" rx="10" fill="#ffffff" stroke="#dce3ee"/>
  <text x="756" y="180" font-size="13.5" font-weight="650" fill="#18233b" text-anchor="middle">工具层</text>
  <text x="756" y="202" font-size="11.5" fill="#52627a" text-anchor="middle">读写文件 · 执行命令 · 搜索</text>

  <rect x="64" y="238" width="280" height="70" rx="10" fill="#ffffff" stroke="#dce3ee"/>
  <text x="204" y="266" font-size="13.5" font-weight="650" fill="#18233b" text-anchor="middle">权限与沙箱</text>
  <text x="204" y="288" font-size="11.5" fill="#52627a" text-anchor="middle">什么自动做,什么先问人</text>

  <rect x="360" y="238" width="240" height="70" rx="10" fill="#e9edff" stroke="#4255cf" stroke-width="2"/>
  <text x="480" y="266" font-size="13.5" font-weight="650" fill="#3344ad" text-anchor="middle">主循环</text>
  <text x="480" y="288" font-size="11.5" fill="#52627a" text-anchor="middle">回填结果 · 决定下一步</text>

  <rect x="616" y="238" width="280" height="70" rx="10" fill="#ffffff" stroke="#dce3ee"/>
  <text x="756" y="266" font-size="13.5" font-weight="650" fill="#18233b" text-anchor="middle">工具接入</text>
  <text x="756" y="288" font-size="11.5" fill="#52627a" text-anchor="middle">API · MCP 协议 · 插件</text>

  <rect x="64" y="324" width="280" height="70" rx="10" fill="#ffffff" stroke="#dce3ee"/>
  <text x="204" y="352" font-size="13.5" font-weight="650" fill="#18233b" text-anchor="middle">子 Agent 编排</text>
  <text x="204" y="374" font-size="11.5" fill="#52627a" text-anchor="middle">任务拆解 · 并行执行 · 汇总</text>

  <rect x="360" y="324" width="240" height="70" rx="10" fill="#e9edff" stroke="#4255cf" stroke-width="2"/>
  <text x="480" y="352" font-size="13.5" font-weight="650" fill="#3344ad" text-anchor="middle">错误恢复</text>
  <text x="480" y="374" font-size="11.5" fill="#52627a" text-anchor="middle">重试 · 中断 · 回滚</text>

  <rect x="616" y="324" width="280" height="70" rx="10" fill="#ffffff" stroke="#dce3ee"/>
  <text x="756" y="352" font-size="13.5" font-weight="650" fill="#18233b" text-anchor="middle">记录与评测</text>
  <text x="756" y="374" font-size="11.5" fill="#52627a" text-anchor="middle">轨迹 · 成本 · 回放调试</text>

  <rect x="64" y="414" width="832" height="52" rx="10" fill="#ffffff" stroke="#dce3ee"/>
  <text x="480" y="446" font-size="13" fill="#52627a" text-anchor="middle">环境边界:文件系统 · 终端 · 浏览器 · 网络 —— 能碰什么、碰多少,由 Harness 说了算</text>

  <rect x="40" y="548" width="880" height="64" rx="12" fill="#e9edff"/>
  <text x="480" y="574" font-size="13.5" font-weight="650" fill="#3344ad" text-anchor="middle">同一个模型,换一套 Harness,能干成的事可能差一个数量级;</text>
  <text x="480" y="598" font-size="13.5" font-weight="650" fill="#3344ad" text-anchor="middle">所以看到榜单先问一句:这成绩里,模型占几成,Harness 占几成?</text>
</svg>

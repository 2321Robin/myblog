name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # npm test relies on Node's type stripping, available from 22.6
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test the production build
        run: |
          SITE_URL=https://example.test npx next start -H 127.0.0.1 -p 3100 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3100/robots.txt > /dev/null; then break; fi
            sleep 1
          done
          node scripts/check-site.mjs http://127.0.0.1:3100
